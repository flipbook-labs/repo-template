name: Release

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` starts a run as soon as someone adds the `debug:release-pr`
    # label. On a pull request, the job only runs when that label is present,
    # and it opens a `[DEBUG]` publish PR without releasing anything.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      force-version:
        description: "Open a publish PR that sets this exact version (e.g. 1.2.3)"
        default: ""
        required: false

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  release:
    # repo-template itself never releases, so this job skips there. In a
    # repository created from the template, the name never matches, and the job
    # runs as usual.
    if: >-
      github.repository != 'flipbook-labs/repo-template' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'debug:release-pr'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    # Pushes and manual runs queue behind each other instead of cancelling,
    # which the unlock's `base-sha` check relies on.
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # The publish PR can't merge while this run refreshes it. Locking in the
      # same job as the unlock guarantees the unlock runs after it.
      - name: Lock the Publish PR
        if: github.event_name != 'pull_request'
        uses: flipbook-labs/changewrite/publish-lock@v0.17.0
        with:
          locked: true
          url: ${{ env.RUN_URL }}

      # A publish PR opened with the default GITHUB_TOKEN doesn't trigger CI,
      # so Changewrite opens it as the Flipbook Backend App instead.
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FLIPBOOK_BACKEND_CLIENT_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      # The unlock compares this commit against `main` to catch a push that
      # landed after the publish PR was refreshed.
      - name: Record the Refreshed Base Commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: flipbook-labs/changewrite@v0.17.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-token: ${{ steps.app-token.outputs.token }}
          debug: ${{ github.event_name == 'pull_request' }}
          force-version: ${{ inputs.force-version || '' }}

      - name: Unlock the Publish PR
        if: github.event_name != 'pull_request'
        uses: flipbook-labs/changewrite/publish-lock@v0.17.0
        with:
          locked: false
          base-sha: ${{ steps.base.outputs.sha }}
          url: ${{ env.RUN_URL }}
